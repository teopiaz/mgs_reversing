; Metal Gear Solid port config. Hand-editable; the menu writes
; this file when you click 'Save & Apply'. Integer values
; for kb_map / pad_map are raw SDL enum values.

[video]
window_w   = 1280
window_h   = 896
fullscreen = 0
vsync      = 1
gl_enabled = 1
gl_scale   = 4
widescreen = 0

[audio]
volume_master = 100

[game]
language = 1  ; 0 = Japanese, 1 = English

[keyboard] ; values are SDL_Scancode integers
up       = 82  ; Up
down     = 81  ; Down
left     = 80  ; Left
right    = 79  ; Right
cross    = 27  ; X
circle   = 29  ; Z
triangle = 22  ; S
square   = 4  ; A
l1       = 20  ; Q
r1       = 8  ; E
l2       = 30  ; 1
r2       = 32  ; 3
start    = 40  ; Return
select   = 42  ; Backspace

[gamepad] ; values are SDL_GameControllerButton ints; -1 = unbound (triggers used for L2/R2)
up       = 11  ; dpup
down     = 12  ; dpdown
left     = 13  ; dpleft
right    = 14  ; dpright
cross    = 0  ; a
circle   = 1  ; b
triangle = 3  ; y
square   = 2  ; x
l1       = 9  ; leftshoulder
r1       = 10  ; rightshoulder
l2       = -1  ; (unbound)
r2       = -1  ; (unbound)
start    = 6  ; start
select   = 4  ; back
